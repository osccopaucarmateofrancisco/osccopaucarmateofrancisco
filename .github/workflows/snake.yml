name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Fix ownership of the files generated by the snk container
        run: sudo chown -R $(id -u):$(id -g) dist

      - name: Make the snake move cell by cell (discrete hops instead of a smooth glide)
        run: |
          python3 .github/scripts/discretize_snake.py dist/snake.svg dist/snake.tmp.svg
          mv -f dist/snake.tmp.svg dist/snake.svg
          python3 .github/scripts/discretize_snake.py dist/snake-dark.svg dist/snake-dark.tmp.svg
          mv -f dist/snake-dark.tmp.svg dist/snake-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
